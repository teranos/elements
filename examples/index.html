<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>@teranos/elements — specimens</title>
  <style>
    /* The package's own identity: black and white. Structure follows a
       working consumer — the tray is a fixed right-edge column, the dots
       carry the pointer events, and a window is reached through [data-form]. */
    :root {
      --border: #fff;
      --border-radius: 0;
      --font-size-sm: 12px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #000;
      color: #fff;
      font: 13px/1.4 var(--font-mono);
      min-height: 100vh;
    }

    /* The tray's place, layout and motion are the package's. Its look is the page's theme. */
    .dot {
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      overflow: hidden;
      border: 1px solid #fff;
    }

    /* The symbol's place in the dot is the package's; its font is the page's. */
    .dot-symbol {
      font: 700 11px/1 var(--font-mono);
    }

    /* Position and stacking during a morph are written inline by prepareMorphTo.
       data-form is written at morph start and stays, so one selector
       covers a window from its first frame through to the settled state.

       Its surface comes from the element's own color, written inline at morph
       commit — visual identity, never overridden. This supplies only the
       default border, which an element's own border (inline) beats. */
    [data-form="window"] {
      pointer-events: auto;
      border: 1px solid #fff;
    }

    /* A tooltip's place is the package's; how it looks is the page's. */
    [data-form="tooltip"] {
      border: 1px solid #fff;
      padding: 4px 8px;
      font-size: var(--font-size-sm);
      max-width: 320px;
    }

    [data-form="tooltip"] .content-area {
      padding: 6px 0 0;
    }

    /* A button is the page's to dress: it looks like every other button here. */
    .specimen-button {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: var(--border-radius);
      font: inherit;
      font-size: var(--font-size-sm);
      cursor: pointer;
      user-select: none;
    }

    .specimen-button:hover { background: #fff; color: #000; }

    /* A field is the page's to dress. Its text is 16px because iOS Safari zooms
       the page on focus for anything smaller, and a zoomed page moves every
       window out from under the finger. */
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field .label {
      font-size: var(--font-size-sm);
    }

    .field .input {
      font: 16px/1.4 var(--font-mono);
      padding: 8px;
      min-height: 44px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: var(--border-radius);
    }

    /* A panel's edge, as QNTX dresses it (css/element/states/panel.css). Which
       edge, and how far in from the device's own, is the package's. */
    .panel-resize-handle {
      position: absolute;
      left: 0;
      width: 100%;
      height: 6px;
      cursor: ns-resize;
      z-index: 1;
      background: #fff;
    }
    .panel-resize-handle--bottom { bottom: 0; }
    .panel-resize-handle--top { top: 0; }

    /* The corner's place and size are the package's; how it looks is the page's. */
    .resize-handle {
      background: #fff;
    }

    .title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      height: 32px;
      width: 100%;
      background-color: #000;
      border-bottom: 1px solid #fff;
      flex-shrink: 0;
      user-select: none;
      cursor: move;
      font-size: var(--font-size-sm);
      color: #fff;
    }

    .title-bar button {
      width: 22px;
      height: 22px;
      padding: 1px 2px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin-left: 2px;
    }

    .title-bar button:hover { background: #fff; color: #000; }

    .content-area {
      flex: 1 1 auto;
      overflow: auto;
      padding: 8px;
    }

    .content {
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
