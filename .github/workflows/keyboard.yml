{
  "jobs": {
    "android": {
      "name": "Android emulator, Chrome",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.9"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "The specimens page",
          "run": "bun examples/serve.ts > serve.log 2>&1 &\nfor i in $(seq 1 30); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done\ncat serve.log; exit 1\n"
        },
        {
          "name": "Hardware acceleration for the emulator",
          "run": "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\n"
        },
        {
          "name": "Tap the field, type, put the keyboard away",
          "uses": "reactivecircus/android-emulator-runner@v2",
          "with": {
            "api-level": 34,
            "arch": "x86_64",
            "disable-animations": true,
            "profile": "pixel_7",
            "script": "bash browser/keyboard/android.sh",
            "target": "google_apis"
          }
        },
        {
          "if": "always()",
          "name": "What the keyboard looked like",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "keyboard-android",
            "path": "keyboard-shots",
            "retention-days": 14
          }
        }
      ],
      "timeout-minutes": 30
    },
    "ios": {
      "name": "iPhone Simulator, Safari",
      "runs-on": "macos-15",
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.9"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "The specimens page",
          "run": "bun examples/serve.ts > serve.log 2>&1 &\nfor i in $(seq 1 30); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done\ncat serve.log; exit 1\n"
        },
        {
          "name": "Tap the field, type, put the keyboard away",
          "run": "bash browser/keyboard/ios.sh"
        },
        {
          "if": "always()",
          "name": "safaridriver",
          "run": "cat safaridriver.log || true"
        },
        {
          "if": "always()",
          "name": "What the keyboard looked like",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "keyboard-ios",
            "path": "keyboard-shots",
            "retention-days": 14
          }
        }
      ],
      "timeout-minutes": 30
    }
  },
  "name": "Keyboard",
  "on": {
    "pull_request": null,
    "workflow_dispatch": null
  }
}
