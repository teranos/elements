{
  "jobs": {
    "browser": {
      "name": "Browser",
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.9"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "Chromium and WebKit, as the pinned @playwright/test wants them",
          "run": "npx playwright install --with-deps chromium webkit"
        },
        {
          "env": {
            "CI": "1"
          },
          "name": "Desktop, Pixel 7 and iPhone 15",
          "run": "npx playwright test -c browser"
        },
        {
          "if": "failure()",
          "name": "What the browser saw",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "browser-report",
            "path": "browser/playwright-report\nbrowser/test-results",
            "retention-days": 14
          }
        }
      ]
    },
    "test": {
      "name": "TypeScript",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.9"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "run": "bun run typecheck"
        },
        {
          "name": "Tests under happy-dom",
          "run": "bun test"
        },
        {
          "env": {
            "USE_JSDOM": 1
          },
          "name": "Tests under JSDOM",
          "run": "bun test"
        }
      ]
    }
  },
  "name": "TypeScript",
  "on": {
    "pull_request": null,
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": null
  }
}
